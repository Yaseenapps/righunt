name: Refresh prices and deploy

on:
  schedule:
    # Every 6 hours. GitHub runs cron in UTC.
    - cron: '15 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Nine shops, and City Center publishes no bulk catalogue so it is read
    # one product page at a time - close to ten thousand of them. At 90
    # minutes every run was being killed mid-scrape.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # City Center's crawler writes down where it got to, so an interrupted
      # read resumes instead of starting again from the first page. That
      # progress lives in .cache, which a fresh runner does not have - so it
      # is carried between runs here.
      - name: Restore crawl progress
        uses: actions/cache@v4
        with:
          path: .cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-

      # The site must publish whether or not this finishes.
      #
      # Every run for the past day hit the job's time limit here and was
      # cancelled, which skipped every step below - so a finished catalogue
      # sat in the repository for a day without ever reaching the site. A
      # scrape that runs out of time should cost us fresh prices, nothing
      # more: the data already committed is still good, and publishing it is
      # still worth doing.
      #
      # Nothing half-written can leak out. The build writes its files only
      # after every shop has been read, so an interrupted scrape leaves the
      # committed data untouched, and check-site.mjs below refuses to publish
      # a catalogue that does not hang together.
      - name: Scrape every store
        continue-on-error: true
        timeout-minutes: 240
        run: npm run scrape

      - name: Show what changed
        if: always()
        run: cat data/status.json || true

      - name: Commit refreshed data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "data: refresh prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Someone may have pushed while this run was scraping. Replay our
            # data commit on top of theirs instead of failing the whole job -
            # and if the push still cannot go through, say so but carry on to
            # the deploy, because a stale commit is no reason to leave the
            # live site un-updated.
            #
            # The abort is the important part. A failed `pull --rebase` stops
            # MID-REBASE, leaving conflict markers in data/ - and the deploy
            # step below copies data/ straight into the published site. That
            # is exactly how "<<<<<<< HEAD" reached the live search index and
            # broke every product link on the site. Aborting puts the tree
            # back to this run's own scrape, which is complete and valid.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              echo "push attempt $attempt did not go through; retrying"
              sleep 5
            done
            echo "::warning::Could not save refreshed prices to the repo. Deploying this run's own data instead."
          fi

      # Only the site itself gets deployed. Uploading the whole checkout would
      # pack node_modules and the scraper source into every deploy - the
      # upload action only excludes .git and .github on its own.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/
          # GitHub Pages serves 404.html for real paths like /products/gpu.
          # It is the app shell too, but NOT a copy of index.html: it has to
          # load its assets from the site root, because it is served from
          # addresses several levels deep. See the comment inside it.
          cp 404.html _site/404.html

      # Nothing broken gets published, whatever went wrong before this point.
      # The site is only as good as its data files: if one of them will not
      # parse, the catalogue does not load, search returns nothing and every
      # product link says "not found". A run that would do that must fail
      # loudly and leave the last good site up instead.
      - name: Refuse to publish a broken site
        run: node scripts/check-site.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
