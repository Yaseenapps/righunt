name: Refresh prices

# Reads all nine shops and commits what changed. Publishing is a separate
# workflow (publish.yml) that follows this one - so however long this takes,
# or however badly it goes, the site still goes up.

on:
  schedule:
    # Every 6 hours. GitHub runs cron in UTC.
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Nine shops, and City Center publishes no bulk catalogue so it is read
    # one product page at a time - close to ten thousand of them. At 90
    # minutes every run was being killed mid-scrape.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # City Center's crawler writes down where it got to, so an interrupted
      # read resumes instead of starting again from the first page. That
      # progress lives in .cache, which a fresh runner does not have - so it
      # is carried between runs here.
      - name: Restore crawl progress
        uses: actions/cache@v4
        with:
          path: .cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-

      # The site must publish whether or not this finishes.
      #
      # Every run for the past day hit the job's time limit here and was
      # cancelled, which skipped every step below - so a finished catalogue
      # sat in the repository for a day without ever reaching the site. A
      # scrape that runs out of time should cost us fresh prices, nothing
      # more: the data already committed is still good, and publishing it is
      # still worth doing.
      #
      # Nothing half-written can leak out. The build writes its files only
      # after every shop has been read, so an interrupted scrape leaves the
      # committed data untouched, and check-site.mjs below refuses to publish
      # a catalogue that does not hang together.
      - name: Scrape every store
        continue-on-error: true
        timeout-minutes: 240
        run: npm run scrape

      - name: Show what changed
        if: always()
        run: cat data/status.json || true

      - name: Commit refreshed data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "data: refresh prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Someone may have pushed while this run was scraping. Replay our
            # data commit on top of theirs rather than failing the whole job.
            #
            # The abort is the important part. A failed `pull --rebase` stops
            # MID-REBASE, leaving conflict markers in data/ - and those files
            # are what gets published. That is exactly how "<<<<<<< HEAD"
            # reached the live search index and broke every product link on
            # the site. Aborting puts the tree back to this run's own scrape,
            # which is complete and valid.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              echo "push attempt $attempt did not go through; retrying"
              sleep 5
            done
            echo "::warning::Could not save refreshed prices. The site keeps the prices it already has."
          fi
